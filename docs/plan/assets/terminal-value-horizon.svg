<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">一小时滚动窗口与终端价值的位置</title>
  <desc id="desc">图中区分当前一小时优化窗口、窗口结束时的电池能量状态和窗口外机会。终端价值用于估计窗口末库存的延续价值，但不会在每个五分钟回放步骤中重复计入已实现现金流。</desc>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #172033;
      --muted: #5f6b7a;
      --line: #8b98aa;
      --window: #dbeafe;
      --window-line: #2563eb;
      --continuation: #ede9fe;
      --continuation-line: #7650c7;
      --state: #dcfce7;
      --state-line: #16803a;
      --warning: #fff4d6;
      --warning-line: #b7791f;
      --panel: #f4f7fb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e8edf5;
        --muted: #b3bdca;
        --line: #8290a3;
        --window: #18385f;
        --window-line: #78aef8;
        --continuation: #33275a;
        --continuation-line: #b7a0ff;
        --state: #173f2b;
        --state-line: #70d995;
        --warning: #4e3a18;
        --warning-line: #f2c25f;
        --panel: #202a38;
      }
    }
    text {
      fill: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .title { font-size: 24px; font-weight: 500; }
    .label { font-size: 16px; font-weight: 500; }
    .small { font-size: 13px; }
    .note { font-size: 14px; fill: var(--muted); }
    .axis { stroke: var(--line); stroke-width: 2; }
    .boundary { stroke: var(--state-line); stroke-width: 3; }
    .connector { stroke: var(--continuation-line); stroke-width: 2; fill: none; }
    .dashed { stroke-dasharray: 7 5; }
    .window-box { fill: var(--window); stroke: var(--window-line); stroke-width: 1.5; }
    .continuation-box { fill: var(--continuation); stroke: var(--continuation-line); stroke-width: 1.5; }
    .state-box { fill: var(--state); stroke: var(--state-line); stroke-width: 1.5; }
    .warning-box { fill: var(--warning); stroke: var(--warning-line); stroke-width: 1.5; }
    .panel-box { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="var(--continuation-line)"/>
    </marker>
  </defs>

  <text x="600" y="38" text-anchor="middle" class="title">一小时窗口结束，不等于剩余电量价值归零</text>

  <rect x="75" y="98" width="610" height="108" rx="8" class="window-box"/>
  <text x="380" y="126" text-anchor="middle" class="label">当前随机 MPC 窗口：H=12，未来 60 分钟</text>
  <text x="380" y="151" text-anchor="middle" class="small">场景内逐步计算五分钟现金流 Π₁…Π₁₂，并只执行当前第一步</text>
  <text x="380" y="178" text-anchor="middle" class="note">后 11 步用于当前首动作的机会成本估计，不是已批准的未来动作</text>

  <rect x="715" y="98" width="410" height="108" rx="8" class="continuation-box"/>
  <text x="920" y="126" text-anchor="middle" class="label">窗口外延续机会</text>
  <text x="920" y="151" text-anchor="middle" class="small">价格、费用、效率、退化与可执行策略共同影响价值</text>
  <text x="920" y="178" text-anchor="middle" class="note">V0 为零估值对照；V1 待验证；V2 需额外数据审计</text>

  <line x1="75" y1="270" x2="1125" y2="270" class="axis"/>
  <line x1="75" y1="250" x2="75" y2="290" class="axis"/>
  <line x1="685" y1="224" x2="685" y2="342" class="boundary"/>
  <line x1="1125" y1="250" x2="1125" y2="290" class="axis"/>

  <text x="75" y="316" text-anchor="middle" class="label">10:00</text>
  <text x="75" y="337" text-anchor="middle" class="note">本轮开始</text>
  <text x="685" y="367" text-anchor="middle" class="label">τ = t + HΔt</text>
  <text x="685" y="388" text-anchor="middle" class="note">本例为 11:00（AEST）</text>
  <text x="1125" y="238" text-anchor="end" class="label">更远未来</text>

  <g aria-label="十二个五分钟现金流区间">
    <rect x="75" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="125.83" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="176.66" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="227.49" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="278.32" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="329.15" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="379.98" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="430.81" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="481.64" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="532.47" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="583.30" y="250" width="50.83" height="40" class="window-box"/>
    <rect x="634.13" y="250" width="50.87" height="40" class="window-box"/>
    <text x="100" y="276" text-anchor="middle" class="small">Π₁</text>
    <text x="354" y="276" text-anchor="middle" class="small">…</text>
    <text x="659" y="276" text-anchor="middle" class="small">Π₁₂</text>
  </g>

  <rect x="558" y="405" width="254" height="62" rx="8" class="state-box"/>
  <text x="685" y="431" text-anchor="middle" class="label">窗口末状态 E₍H+1,s₎</text>
  <text x="685" y="454" text-anchor="middle" class="small">O0 共用动作时，各场景末电量相同</text>

  <path d="M812 436 L824 436 L824 388 L850 354 L862 354" class="connector dashed" marker-end="url(#arrow)"/>
  <rect x="862" y="300" width="262" height="68" rx="8" class="continuation-box"/>
  <text x="993" y="327" text-anchor="middle" class="label">Vₜ(E₍H+1,s₎, ctxτ)</text>
  <text x="993" y="350" text-anchor="middle" class="small">近似窗口外增量机会成本</text>

  <rect x="75" y="405" width="392" height="62" rx="8" class="panel-box"/>
  <text x="271" y="431" text-anchor="middle" class="label">单个场景的规划价值：Σₖ Πₖ,s + Vₜ(·)</text>
  <text x="271" y="454" text-anchor="middle" class="small">完整目标还需场景加权、基准比较和风险惩罚</text>

  <rect x="835" y="405" width="290" height="62" rx="8" class="warning-box"/>
  <text x="980" y="431" text-anchor="middle" class="label">实际回放收益不计入每轮 Vₜ</text>
  <text x="980" y="454" text-anchor="middle" class="small">回测段末按共同约束或惩罚／调整规则处理</text>
</svg>
